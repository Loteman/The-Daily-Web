<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מסך התחברות - The Web Daily</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card-container">
        
        <!-- אזור ימין: טופס התחברות -->
        <div class="form-section">
            <h2>התחברות</h2>
            <p class="form-subtitle">התחבר כדי לגשת לאזור העבודה שלך</p>

            <form class="login-form">
                
                <!-- שדה שם משתמש -->
                <div class="input-group">
                    <span class="icon-right">
                        <!-- אייקון מעטפה (SVG) -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </span>
                    <input type="text" placeholder="שם משתמש / אימייל">
                </div>

                <!-- שדה סיסמה -->
                <div class="input-group">
                    <span class="icon-right">
                        <!-- אייקון מנעול -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" placeholder="סיסמה">
                    <span class="icon-left">
                        <!-- אייקון עין -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>

                <button type="button" class="btn-submit">התחבר</button>

            </form>
        </div>

        <!-- אזור שמאל: מיתוג (The Web Daily) -->
        <div class="brand-section">
            <div class="brand-header">
                <h1 class="brand-title">The <span class="text-blue">Web Daily</span></h1>
                <p class="brand-subtitle">News Today. A Better Tomorrow.</p>
            </div>

            <!-- איור העיתון (SVG) -->
            <div class="illustration">
                <svg width="260" height="220" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
                    <!-- עלים / צורות רקע -->
                    <path d="M20 140 C 0 110, 40 80, 50 100 C 60 120, 20 160, 20 140 Z" fill="#cbd5e1" opacity="0.6"/>
                    <path d="M40 180 C 10 160, 30 110, 60 130 C 80 140, 50 190, 40 180 Z" fill="#94a3b8" opacity="0.4"/>
                    <circle cx="150" cy="120" r="85" fill="#e2e8f0" opacity="0.4" />
                    
                    <!-- קופסת העיתון -->
                    <rect x="70" y="40" width="140" height="130" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
                    
                    <!-- כותרת NEWS -->
                    <text x="85" y="75" font-family="sans-serif" font-weight="900" font-size="22" fill="#94a3b8" letter-spacing="1">NEWS</text>
                    
                    <!-- תמונה בתוך העיתון -->
                    <rect x="85" y="90" width="55" height="45" rx="3" fill="#cbd5e1" />
                    <path d="M85 135 L100 110 L115 130 L130 105 L140 135 Z" fill="#94a3b8" />
                    <circle cx="125" cy="100" r="4" fill="#f1f5f9" />
                    
                    <!-- שורות טקסט -->
                    <rect x="150" y="90" width="45" height="5" rx="2" fill="#cbd5e1" />
                    <rect x="150" y="102" width="45" height="5" rx="2" fill="#cbd5e1" />
                    <rect x="150" y="114" width="35" height="5" rx="2" fill="#cbd5e1" />
                    <rect x="150" y="126" width="40" height="5" rx="2" fill="#cbd5e1" />
                    
                    <rect x="85" y="150" width="110" height="5" rx="2" fill="#e2e8f0" />
                </svg>
            </div>

            <div class="brand-footer">
                <p class="brand-footer-text">חדשות שמחברות אותך לעולם</p>
               
            </div>
        </div>

    </div>

<!-- ספרית DOMPurify לניקוי קלטים -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <!-- קובץ ה-JS שלך -->
    <script src="login.js"></script>


</body>
</html>
