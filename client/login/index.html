<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מסך התחברות - The Daily Web</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" integrity="sha384-nU14brUcp6StFntEOOEBvcJm4huWjB0SvIeQ3PyEDzxJW37Qz8QfoIzyP3pvuNii" crossorigin="anonymous">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">

<main class="card-container shadow-lg rounded overflow-hidden bg-white d-flex flex-column flex-md-row mb-4">        
        <!-- Right side: login form -->
        <div class="form-section p-4 p-md-5 d-flex flex-column justify-content-center">
            <h2 class="fw-bold mb-2">התחברות</h2>
            <p class="form-subtitle text-muted mb-4">התחבר כדי לגשת לאזור העבודה שלך</p>

            <form class="login-form">
                
                <!-- Username field -->
                <div class="input-group mb-3 position-relative">
                    <span class="icon-right input-group-text bg-transparent border-end-0">
                        <!-- icon (SVG) -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    <input type="text" class="form-control" placeholder="שם משתמש">
                </div>

                <!-- Password field -->
                <div class="input-group mb-4 position-relative">
                    <span class="icon-right input-group-text bg-transparent border-end-0">
                        <!-- Lock icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </span>
                    <input type="password" class="form-control" placeholder="סיסמה">
                    <span class="icon-left input-group-text bg-transparent border-start-0 cursor-pointer">
                        <!-- Eye icon -->
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </span>
                </div>

                <button type="submit" class="btn btn-submit w-100 mb-3 py-2">התחבר</button>


                <a class="btn-back d-block w-100" href="../articlesFeed/index.html">כניסה כאורח</a>

            </form>
        </div>

        <!-- Left side: branding (The Daily Web) -->
        <div class="brand-section d-flex flex-column justify-content-between p-4 p-md-5 text-white bg-dark">
            <div class="brand-header">
                <h1 class="brand-title fs-2 fw-bold">The <span class="text-blue text-primary">Daily Web</span></h1>
                <p class="brand-subtitle text-white-50">News Today. A Better Tomorrow.</p>
            </div>

            <!-- Newspaper illustration (SVG) -->
            <div class="illustration text-center my-4">
                <svg width="260" height="220" viewBox="0 0 260 220" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background leaves / shapes -->
                    <path d="M20 140 C 0 110, 40 80, 50 100 C 60 120, 20 160, 20 140 Z" fill="#cbd5e1" opacity="0.6"/>
                    <path d="M40 180 C 10 160, 30 110, 60 130 C 80 140, 50 190, 40 180 Z" fill="#94a3b8" opacity="0.4"/>
                    <circle cx="150" cy="120" r="85" fill="#e2e8f0" opacity="0.4" />
                    
                    <!-- Newspaper box -->
                    <rect x="70" y="40" width="140" height="130" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="4" />
                    
                    <!-- NEWS heading -->
                    <text x="85" y="75" font-family="sans-serif" font-weight="900" font-size="22" fill="#94a3b8" letter-spacing="1">NEWS</text>
                    
                    <!-- Image inside the newspaper -->
                    <rect x="85" y="90" width="55" height="45" rx="3" fill="#cbd5e1" />
                    <path d="M85 135 L100 110 L115 130 L130 105 L140 135 Z" fill="#94a3b8" />
                    <circle cx="125" cy="100" r="4" fill="#f1f5f9" />
                    
                    <!-- Text lines -->
                    <rect x="150" y="90" width="45" height="5" rx="2" fill="#cbd5e1" />
                    <rect x="150" y="102" width="45" height="5" rx="2" fill="#cbd5e1" />
                    <rect x="150" y="114" width="35" height="5" rx="2" fill="#cbd5e1" />
                    <rect x="150" y="126" width="40" height="5" rx="2" fill="#cbd5e1" />
                    
                    <rect x="85" y="150" width="110" height="5" rx="2" fill="#e2e8f0" />
                </svg>
            </div>

            <div class="brand-footer">
                <p class="brand-footer-text text-white-50 mb-0">חדשות שמחברות אותך לעולם</p>
            </div>
        </div>

    </main>

   
    <script type="module" src="login.js"></script>
</body>
</html>
