<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ניהול משתמשים — The Web Daily</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="/header/style.css">
</head>
<body>
  <header class="header"></header>
  <script>
    // Paints the cached header markup + last-known login state immediately, before the deferred
    // module script even runs, so returning to a page already visited this tab doesn't flash the
    // "guest" defaults before the real nav items for the logged-in user pop in a moment later.
    try {
      var cachedUserRaw = sessionStorage.getItem('header-user-v1');
      var cachedUser = cachedUserRaw ? JSON.parse(cachedUserRaw) : null;
      var cachedHeader = sessionStorage.getItem('header-html-v1');
      if (cachedHeader) {
        var headerEl = document.querySelector('.header');
        headerEl.innerHTML = cachedHeader;
        if (cachedUserRaw) {
          headerEl.querySelector('.user-name').textContent = cachedUser ? (cachedUser.fullName || cachedUser.username) : 'Guest';
          headerEl.querySelector('.login-link').hidden = Boolean(cachedUser);
          var loggedInEls = headerEl.querySelectorAll('[data-logged-in]');
          for (var i = 0; i < loggedInEls.length; i++) loggedInEls[i].hidden = !cachedUser;
          var editorEls = headerEl.querySelectorAll('[data-editor-only]');
          for (var j = 0; j < editorEls.length; j++) editorEls[j].hidden = !cachedUser || cachedUser.role !== 'editor';
        }
      }
    } catch (error) { /* sessionStorage unavailable - header.js will fill it in as normal */ }
  </script>
  <main>
    <div class="page-heading"><div><p class="eyebrow">הרשאות וגישה</p><h1>ניהול משתמשים</h1><p id="scope"></p></div><a class="back-link" href="/articlesManagement/index.html">ניהול כתבות ←</a></div>
    <script>
      // #scope's text only depends on the cached user, so - like the header above - it doesn't need
      // to wait for the /api/auth/me round-trip to appear (this element didn't exist yet up above).
      try { if (typeof cachedUser !== 'undefined' && cachedUser) {
        document.getElementById('scope').textContent = 'מחובר/ת כ-' + (cachedUser.fullName || cachedUser.username) + ' (עורך)';
      } } catch (error) { /* users.js will fill it in as normal */ }
    </script>
    <div id="message" role="status" aria-live="polite"></div>
    <div id="dashboard">
      <div class="loading-overlay" role="status" aria-label="טוען">
        <div class="loading-spinner"></div>
      </div>
      <section class="filters" aria-label="סינון וחיפוש">
        <label>חיפוש<input id="search" type="search" placeholder="שם משתמש או שם מלא..."></label>
        <button id="new-user" type="button">משתמש חדש +</button>
      </section>
      <section class="panel">
        <div class="table-scroll">
          <table>
            <thead><tr><th>שם משתמש</th><th>שם מלא</th><th>תפקיד</th><th>פעולות</th></tr></thead>
            <tbody id="users-table">
              <tr><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td></tr>
              <tr><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td></tr>
              <tr><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td></tr>
              <tr><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td><td><div class="skeleton" style="height:1.2em"></div></td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <dialog class="user-dialog">
    <form id="user-form">
      <h2 class="dialog-title"></h2>
      <label>שם משתמש<input name="username" required maxlength="100"></label>
      <label>שם מלא<input name="fullName" required maxlength="100"></label>
      <label>תפקיד<select name="role" required>
        <option value="reporter">כתב</option>
        <option value="editor">עורך</option>
      </select></label>
      <label>סיסמה<input name="password" type="password" autocomplete="new-password"><small class="password-hint"></small></label>
      <p class="dialog-message" role="alert"></p>
      <div class="dialog-actions">
        <button type="submit" class="btn-primary">שמירה</button>
        <button type="button" class="close-dialog">ביטול</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/header/header.js"></script>
  <script type="module" src="users.js"></script>
</body>
</html>
