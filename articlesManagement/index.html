<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול כתבות - The Web Daily</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">
        
    <!-- הדר עליון -->
    <header class="dashboard-header">
        <div class="header-inner">
            <!-- אזור משתמש (ימין) -->
            <div class="user-profile">
                <div class="avatar">👤</div>
                <div class="user-details">
                    <div class="user-name"><span class="arrow-down">⌄</span></div>
                    <div class="user-role"></div>
                </div>
            </div>

            <!-- תפריט ניווט (מרכז) -->
            <nav class="top-nav">
                <a href="#">עורכים</a>
                <a href="#">קטגוריות</a>
                <a href="#">כתבות</a>
                <a href="#">דף הבית</a>
            </nav>

            <!-- לוגו (שמאל) -->
            <div class="brand-logo">
                <span class="logo-title">The Web Daily</span>
                <span class="logo-subtitle">חדשות שמחברות אותך לעולם</span>
            </div>
        </div>
    </header>

    <!-- תוכן מרכזי -->
    <div class="dashboard-container">

        <!-- כותרת העמוד -->
        <div class="page-title-section">
            <h1 class="page-title">ניהול כתבות</h1>
            <p class="page-subtitle">כאן ניתן לנהל את הכתבות שלך</p>
        </div>

        <!-- 4 כרטיסי סטטיסטיקה -->
        <div class="stats-grid">
            <!-- כרטיס 1 -->
            <div class="stat-card">
                <div class="stat-content">
                    <div class="stat-number color-blue">3</div>
                    <div class="stat-label">בהכנה</div>
                </div>
                <div class="stat-icon-box bg-blue-light">📄</div>
            </div>

            <!-- כרטיס 2 -->
            <div class="stat-card">
                <div class="stat-content">
                    <div class="stat-number color-orange">2</div>
                    <div class="stat-label">ממתינות לאישור</div>
                </div>
                <div class="stat-icon-box bg-orange-light">🕒</div>
            </div>

            <!-- כרטיס 3 -->
            <div class="stat-card">
                <div class="stat-content">
                    <div class="stat-number color-green">5</div>
                    <div class="stat-label">פורסמו</div>
                </div>
                <div class="stat-icon-box bg-green-light">☑️</div>
            </div>

            <!-- כרטיס 4 -->
            <div class="stat-card">
                <div class="stat-content">
                    <div class="stat-number color-red">1</div>
                    <div class="stat-label">הוחזרה לתיקונים</div>
                </div>
                <div class="stat-icon-box bg-red-light">📝</div>
            </div>
        </div>

        <!-- כרטיס הטבלה הראשי -->
        <div class="main-card">

            <!-- סרגל כלים וסינון -->
            <div class="toolbar-section">
                <button class="btn-new-article">
                    <span class="plus-icon">+</span> כתבה חדשה
                </button>

                <div class="filter-controls">
                    <div class="custom-select">
                        <select>
                            <option>כל הקטגוריות</option>
                        </select>
                        <span class="select-arrow">♢</span>
                        <span class="select-arrow-down">⌄</span>
                    </div>

                    <div class="custom-select">
                        <select>
                            <option>כל הסטטוסים</option>
                        </select>
                        <span class="select-arrow">🌪️</span>
                        <span class="select-arrow-down">⌄</span>
                    </div>

                    <div class="search-box">
                        <input type="text" placeholder="חיפוש כתבות...">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>
            </div>

            <!-- טבלת הנתונים -->
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="th-title">כותרת הכתבה</th>
                            <th class="th-category">קטגוריה</th>
                            <th class="th-status">סטטוס</th>
                            <th class="th-date">עדכון אחרון</th>
                            <th class="th-actions">פעולות</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- שורה 1 -->
                        <tr>
                            <td>
                                <div class="article-info">
                                    <div class="article-img thumb-robot"></div>
                                    <div class="article-text">
                                        <div class="article-heading"></div>
                                        <div class="article-sub"></div>
                                    </div>
                                </div>
                            </td>
                            <td></td>
                            <td><span class="badge badge-blue"></span></td>
                            <td class="date-cell">
                                <div></div>
                                <div class="time-str"></div>
                            </td>
                            <td>
                                <div class="action-group">
                                    <button class="btn-outline"></button>
                                    <button class="btn-dots"></button>
                                </div>
                            </td>
                        </tr>

                        <!-- שורה 2 -->
                        <tr>
                            <td>
                                <div class="article-info">
                                    <div class="article-img thumb-laptop"></div>
                                    <div class="article-text">
                                        <div class="article-heading"></div>
                                        <div class="article-sub"></div>
                                    </div>
                                </div>
                            </td>
                            <td></td>
                            <td><span class="badge badge-orange"></span></td>
                            <td class="date-cell">
                                <div></div>
                                <div class="time-str"></div>
                            </td>
                            <td>
                                <div class="action-group">
                                    <button class="btn-outline btn-blue-border"></button>
                                    <button class="btn-dots"></button>
                                </div>
                            </td>
                        </tr>

                        <!-- שורה 3 -->
                        <tr>
                            <td>
                                <div class="article-info">
                                    <div class="article-img thumb-city"></div>
                                    <div class="article-text">
                                        <div class="article-heading"></div>
                                        <div class="article-sub"></div>
                                    </div>
                                </div>
                            </td>
                            <td></td>
                            <td><span class="badge badge-green"></span></td>
                            <td class="date-cell">
                                <div></div>
                                <div class="time-str"></div>
                            </td>
                            <td>
                                <div class="action-group">
                                    <button class="btn-outline"></button>
                                    <button class="btn-dots"></button>
                                </div>
                            </td>
                        </tr>

                        <!-- שורה 4 -->
                        <tr>
                            <td>
                                <div class="article-info">
                                    <div class="article-img thumb-person"></div>
                                    <div class="article-text">
                                        <div class="article-heading"></div>
                                        <div class="article-sub"></div>
                                    </div>
                                </div>
                            </td>
                            <td>חברה</td>
                            <td><span class="badge badge-red"></span></td>
                            <td class="date-cell">
                                <div></div>
                                <div class="time-str"></div>
                            </td>
                            <td>
                                <div class="action-group">
                                    <button class="btn-outline"></button>
                                    <button class="btn-dots"></button>
                                </div>
                            </td>
                        </tr>

                        <!-- שורה 5 -->
                        <tr>
                            <td>
                                <div class="article-info">
                                    <div class="article-img thumb-food"></div>
                                    <div class="article-text">
                                        <div class="article-heading"></div>
                                        <div class="article-sub"></div>
                                    </div>
                                </div>
                            </td>
                            <td></td>
                            <td><span class="badge badge-blue"></span></td>
                            <td class="date-cell">
                                <div></div>
                                <div class="time-str"></div>
                            </td>
                            <td>
                                <div class="action-group">
                                    <button class="btn-outline"></button>
                                    <button class="btn-dots">⋮</button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- סרגל דפדוף בתחתית -->
            <div class="pagination-bar">
                <div class="pagination-summary"></div>
                <div class="pagination-buttons">
                    <button class="p-btn">&lt;</button>
                    <button class="p-btn active">1</button>
                    <button class="p-btn">2</button>
                    <button class="p-btn">3</button>
                    <button class="p-btn">&gt;</button>
                </div>
            </div>

        </div>
    </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>

<script type="module" src="articlesManagement.js"></script>

</body>
</html>
