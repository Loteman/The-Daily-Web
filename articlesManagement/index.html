<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ניהול כתבות - The Web Daily</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../header/style.css">
</head>
<body class="dashboard-body">
        
    <!-- הדר עליון -->
    <header class="header"></header>

    <!-- תוכן מרכזי -->
    <div class="dashboard-container">

        <!-- כותרת העמוד -->
        <div class="page-title-section">
            <p class="management-message" role="status"></p>
            <h1 class="page-title">ניהול כתבות</h1>
            <p class="page-subtitle">כאן ניתן לנהל את הכתבות שלך</p>
        </div>

        <!-- 4 כרטיסי סטטיסטיקה -->
        <div class="stats-grid" id="statistics">
            <!-- כרטיס 1 -->
            <div class="stat-card">
                <div class="stat-content">
                    <div class="stat-number color-blue">3</div>
                    <div class="stat-label">בהכנה</div>
                </div>
                <div class="stat-icon-box bg-blue-light">📄</div>
            </div>

            <!-- כרטיס 2 -->
            <div class="stat-card">
                <div class="stat-content">
                    <div class="stat-number color-orange">2</div>
                    <div class="stat-label">ממתינות לאישור</div>
                </div>
                <div class="stat-icon-box bg-orange-light">🕒</div>
            </div>

            <!-- כרטיס 3 -->
            <div class="stat-card">
                <div class="stat-content">
                    <div class="stat-number color-green">5</div>
                    <div class="stat-label">פורסמו</div>
                </div>
                <div class="stat-icon-box bg-green-light">☑️</div>
            </div>

            <!-- כרטיס 4 -->
            <div class="stat-card">
                <div class="stat-content">
                    <div class="stat-number color-red">1</div>
                    <div class="stat-label">הוחזרה לתיקונים</div>
                </div>
                <div class="stat-icon-box bg-red-light">📝</div>
            </div>
        </div>

        <!-- כרטיס הטבלה הראשי -->
        <div class="main-card">

            <!-- סרגל כלים וסינון -->
            <div class="toolbar-section">
                <button class="btn-new-article">
                    <span class="plus-icon">+</span> כתבה חדשה
                </button>

                <div class="filter-controls">
                    <div class="custom-select">
                        <select>
                            <option>כל הקטגוריות</option>
                        </select>
                        <span class="select-arrow">♢</span>
                        <span class="select-arrow-down">⌄</span>
                    </div>

                    <div class="custom-select">
                        <select>
                            <option>כל הסטטוסים</option>
                        </select>
                        <span class="select-arrow">🌪️</span>
                        <span class="select-arrow-down">⌄</span>
                    </div>

                    <div class="search-box">
                        <input type="text" placeholder="חיפוש כתבות...">
                        <span class="search-icon">🔍</span>
                    </div>
                </div>
            </div>

            <!-- טבלת הנתונים -->
            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th class="th-title">כותרת הכתבה</th>
                            <th class="th-category">קטגוריה</th>
                            <th class="th-status">סטטוס</th>
                            <th class="th-date">עדכון אחרון</th>
                            <th class="th-actions">פעולות</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <!-- סרגל דפדוף בתחתית -->
            <div class="pagination-bar">
                <div class="pagination-summary"></div>
                <div class="pagination-buttons">
                    <button class="p-btn">&lt;</button>
                    <button class="p-btn active">1</button>
                    <button class="p-btn">2</button>
                    <button class="p-btn">3</button>
                    <button class="p-btn">&gt;</button>
                </div>
            </div>

        </div>
    </div>

    <dialog class="article-dialog">
        <form id="article-form">
            <h2 class="dialog-title"></h2>
            <p class="editor-note"></p>
            <label>כותרת<input name="title" required maxlength="200"></label>
            <label>תקציר<textarea name="summary" required rows="3"></textarea></label>
            <label>קטגוריה<input name="category" required maxlength="60" list="article-categories"></label>
            <datalist id="article-categories">
                <option value="עולם"><option value="כלכלה"><option value="טכנולוגיה">
                <option value="ספורט"><option value="סביבה"><option value="מדע">
                <option value="תרבות"><option value="בריאות">
            </datalist>
            <label>תוכן הכתבה<textarea name="content" required rows="10"></textarea></label>
            <label class="review-note-label">הערה ליוצר<textarea name="editorNote" rows="3"></textarea></label>
            <p class="dialog-message" role="alert"></p>
            <div class="dialog-actions">
                <button type="submit" class="btn-new-article save-draft">שמירת טיוטה</button>
                <button type="button" class="btn-outline publish-article">אישור ופרסום</button>
                <button type="button" class="btn-outline return-article">החזרה לתיקונים</button>
                <button type="button" class="btn-outline close-dialog">סגירה</button>
            </div>
        </form>
    </dialog>
    <script type="module" src="../header/header.js"></script>

<script type="module" src="articlesManagement.js"></script>

</body>
</html>
